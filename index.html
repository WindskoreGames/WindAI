<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statisk AI - Extremt Smart</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #chat-container { border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: scroll; }
        #user-input { width: 80%; padding: 5px; }
        #send-btn { padding: 5px 10px; }
        .message { margin: 5px 0; }
        .user { text-align: right; color: blue; }
        .ai { text-align: left; color: green; }
    </style>
</head>
<body>
    <h1>Statisk AI - SKIT Smart!</h1>
    <div id="chat-container"></div>
    <input type="text" id="user-input" placeholder="Skriv din fråga här...">
    <button id="send-btn">Skicka</button>

    <script src="script.js"></script>
</body>
</html>
